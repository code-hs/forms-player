<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width,initial-scale=1.0" />
		<title>Form widget runtime</title>
	</head>
	<body>
		<!--		этот файл очень важен, без него не запуститься serve-->
		<noscript>
			<strong
				>We're sorry but Form widget doesn't work properly without JavaScript
				enabled. Please enable it to continue.</strong
			>
		</noscript>
		<!--		data-mode="dev" необходим, что бы при запуске serve, HRM работал
		со всеми подключенными файлами-->
		<form-widget-g
			data-client-id="345"
			data-page="welcome"
			data-mode="dev"
		></form-widget-g>
	</body>

	<style>
		body,
		html {
			background: #323232;
		}
	</style>
</html>

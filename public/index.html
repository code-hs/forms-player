<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Form widget runtime</title>
		<link rel="stylesheet" href="assets/index.css" />
		<link href="assets/files/widget-form-loader.min.js" rel="preload" 
					as="script" />
	</head>
	<body>
		<script>
			function changePage(page) {
				const form = document.querySelector('form-widget-g');
				form.setAttribute('data-page', page);
			}
			const body = document.querySelector('body');
			const formWidget = document.getElementsByTagName('form-widget-g');
			function changeTheme() {
				const storageTheme = localStorage.getItem('WT');
				if (storageTheme) {
					localStorage.removeItem('WT');
					formWidget[0].dataTheme = body.dataset.theme = 'light';
				} else {
					localStorage.setItem('WT', 'dark');
					formWidget[0].dataTheme = body.dataset.theme = 'dark';
				}
			}
			window.onload = () => {
				const themeColor = localStorage.getItem('WT');
				formWidget[0].dataTheme = body.dataset.theme = themeColor ? 'dark' : 'light';
				document.getElementById('year').innerHTML = new Date().getFullYear();
			};
		</script>
		<div class="page-btns">
			<button onclick="changePage('welcome')">welcome</button>
			<button onclick="changePage('driver-application-confirm')">
				driver -application-confirm
			</button>
			<button onclick="changePage('personal-information-text')">personal-information-text</button>
			<button onclick="changePage('personal-information')">personal-information</button>
			<button onclick="changePage('work-history')">work-history</button>
			<button onclick="changePage('complete')">complete</button>
		</div>

		<div class="wrapper">
			<div class="content">
				<header class="header">
					<button class="btn-theme" onclick="changeTheme()">
						<span class="--light">&#9728;</span>
						<span class="--dark">&#9789;</span>
					</button>
				</header>

				<!--	файл для запуска serve	-->
				<form-widget-g
					data-project-id="62508e2544f0831be0b66a0b"
					data-path="/assets/files"
					data-dev
					data-page="personal-information"
					data-language="en"
					data-theme="light"
				></form-widget-g>

				<div class="footer">
					<p>&copy; <span id="year"></span> Company Global.</p>
				</div>
			</div>
		</div>

		<!-- data-theme="light"-->
		<!-- data-layout="small"-->

		<!--		<script src="dev/mobileConsole.js"></script>-->
		<script src="assets/files/widget-form-loader.min.js"></script>
	</body>

	<style>
		@font-face {
			font-family: 'Proxima Nova 300';
			src: url('./assets/fonts/proxima-nova.otf');
			src: url('./assets/fonts/proxima-nova.woff2') format('woff2'),
			url('./assets/fonts/proxima-nova.woff') format('woff');
		}

		@font-face {
			font-family: 'Proxima Nova 400';
			src: url('./assets/fonts/proxima-nova-400.otf');
			src: url('./assets/fonts/proxima-nova-400.woff2') format('woff2'),
			url('./assets/fonts/proxima-nova-400.woff') format('woff');
		}

		*,
		::after,
		::before {
			-moz-box-sizing: border-box;
			box-sizing: border-box;
			margin: 0;
			padding: 0;
			outline: none;
		}

		body {
		}

		.page-btns button {
			background: transparent;
			color: #9f9f9f;
			border: none;
			border-right: 1px solid gray;
			padding-right: 6px;
			cursor: pointer;
		}
	</style>
</html>

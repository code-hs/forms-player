<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Form</title>
		<link href="/assets/widget-form-loader.min.js" rel="preload" as="script" />
	</head>
	<body>
		<script>
			function changePage(page) {
				const form = document.querySelector('form-widget-g');
				form.setAttribute('data-page', page);
			}
		</script>
		<div class="page-btns">
			<button onclick="changePage('welcome')">welcome</button>
			<button onclick="changePage('driver-application-confirm')">
				driver -application-confirm
			</button>
			<button onclick="changePage('personal-information-text')">personal-information-text</button>
			<button onclick="changePage('personal-information')">personal-information</button>
			<button onclick="changePage('work-history')">work-history</button>
			<button onclick="changePage('complete')">complete</button>
		</div>

		<form-widget-g
			data-project-id="62508e2544f0831be0b66a0b"
			data-path="/assets"
			data-page="welcome"
			data-language="en"
			data-theme="dark"
		></form-widget-g>

		<!-- data-theme="light"-->
		<!-- data-layout="small"-->

		<!--		<script src="dev/mobileConsole.js"></script>-->
		<script src="/assets/widget-form-loader.min.js"></script>
	</body>

	<style>
		@font-face {
			font-family: 'Proxima Nova Thin';
			src: url('/assets/fonts/proxima_nova_thin.eot');
			/* IE 9 Compatibility Mode */
			src: url('/assets/fonts/proxima_nova_thin.eot?#iefix') format('embedded-opentype'),
				/* IE < 9 */ url('/assets/fonts/proxima_nova_thin.woff2') format('woff2'),
				/* Super Modern Browsers */ url('/assets/fonts/proxima_nova_thin.woff') format('woff'),
				/* Firefox >= 3.6, any other modern browser */ url('/assets/fonts/proxima_nova_thin.ttf')
					format('truetype'),
				/* Safari, Android, iOS */ url('/assets/fonts/proxima_nova_thin.svg#proxima_nova_thin')
					format('svg'); /* Chrome < 4, Legacy iOS */
		}

		*,
		::after,
		::before {
			-moz-box-sizing: border-box;
			box-sizing: border-box;
			margin: 0;
			padding: 0;
			outline: none;
		}

		body {
			margin: 20px;
			max-width: 600px;
			background: #292a2b;
		}
		
		.page-btns button {
			background: transparent;
			color: #9f9f9f;
			border: none;
			border-right: 1px solid gray;
			padding-right: 6px;
			cursor: pointer;
		}
	</style>
</html>
